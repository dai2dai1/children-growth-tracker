name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install npm dependencies
      run: npm ci

    - name: Build web application
      run: npm run build

    - name: Install Capacitor CLI globally
      run: npm install -g @capacitor/cli

    - name: Sync Capacitor with Android
      run: cap sync android

    - name: Make Gradle wrapper executable
      run: chmod +x android/gradlew

    - name: Clean Android build
      working-directory: android
      run: ./gradlew clean

    - name: Build Android APK with debug info
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon --stacktrace --info

    - name: List build outputs
      run: find android -name "*.apk" -type f

    - name: Check if APK exists
      run: |
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          echo "APK found!"
          ls -la android/app/build/outputs/apk/release/
        else
          echo "APK not found, checking all possible locations:"
          find android -name "*.apk" -type f
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: children-growth-tracker-apk
        path: |
          android/app/build/outputs/apk/release/*.apk
          android/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' && success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: 儿童成长追踪器 v${{ github.run_number }}
        files: android/app/build/outputs/apk/release/*.apk
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}