name: Simple APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Verify build output
      run: |
        echo "Checking dist directory:"
        ls -la dist/
        echo "Build completed successfully"

    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli

    - name: Check Capacitor status
      run: cap doctor

    - name: Sync Android (without building)
      run: cap sync android

    - name: List Android directory
      run: |
        echo "Android directory contents:"
        ls -la android/
        echo "Android app directory:"
        ls -la android/app/

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Test Gradle (list tasks)
      working-directory: android
      run: ./gradlew tasks --all

    - name: Build debug APK first
      working-directory: android
      run: ./gradlew assembleDebug --stacktrace

    - name: Check debug APK
      run: |
        echo "Looking for debug APK:"
        find android -name "*.apk" -type f
        ls -la android/app/build/outputs/apk/debug/ || echo "Debug APK directory not found"

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 7