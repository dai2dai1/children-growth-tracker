name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK components
      run: |
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0"
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platform-tools"

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install npm dependencies
      run: npm ci

    - name: Build web application
      run: npm run build

    - name: Install Capacitor CLI globally
      run: npm install -g @capacitor/cli

    - name: Sync Capacitor with Android
      run: cap sync android

    - name: Make Gradle wrapper executable
      run: chmod +x android/gradlew

    - name: Clean Android build
      working-directory: android
      run: ./gradlew clean --no-daemon

    - name: Build Debug APK (recommended for installation)
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build Release APK
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: List all APK files
      run: |
        echo "=== Debug APK ==="
        find android -name "*debug*.apk" -type f -exec ls -la {} \;
        echo "=== Release APK ==="
        find android -name "*release*.apk" -type f -exec ls -la {} \;

    - name: Upload Debug APK (Most Compatible)
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: children-growth-tracker-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: children-growth-tracker-release-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' && success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: 儿童成长追踪器 v${{ github.run_number }}
        files: |
          android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/release/*.apk
        body: |
          ## 📱 APK 下载说明
          
          **推荐下载**: `app-debug.apk` (兼容性更好，更容易安装)
          
          如果 debug 版本无法安装，请尝试 `app-release.apk`
          
          ### 安装步骤:
          1. 在手机设置中开启"允许安装未知来源应用"
          2. 下载 APK 文件到手机
          3. 点击 APK 文件进行安装
          
          ### 应用功能:
          - ✅ 语音识别和智能解析
          - ✅ 多儿童管理系统  
          - ✅ 积分管理和统计
          - ✅ 数据持久化存储
          - ✅ 响应式移动界面
        generate_release_notes: false
        token: ${{ secrets.GITHUB_TOKEN }}